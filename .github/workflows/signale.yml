name: Handelssignale 5 Minuten

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 4-22 * * 1-5"

permissions: {}

concurrency:
  group: trading-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Scanner-Gedaechtnis laden
        uses: actions/cache/restore@v4
        with:
          path: scanner-state.json
          key: scanner-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-v3-

      - name: Signale pruefen
        env:
          DATA_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          UTC = timezone.utc
          BERLIN = ZoneInfo("Europe/Berlin")
          NY = ZoneInfo("America/New_York")
          INTERVAL = timedelta(minutes=5)
          LOOKBACK_MINUTES = 30
          COOLDOWN_MINUTES = 30
          DAILY_LIMIT = 780
          STATE_FILE = Path("scanner-state.json")

          key = os.environ.get("DATA_KEY", "").strip()
          token = os.environ.get("BOT_TOKEN", "").strip()
          chat = os.environ.get("CHAT_ID", "").strip()

          if not all((key, token, chat)):
              raise SystemExit("Ein erforderliches Secret fehlt.")

                    instruments = [
              ("EUR/USD", "OANDA:EURUSD", "EUR/USD", True),
              ("GBP/USD", "OANDA:GBPUSD", "GBP/USD", True),
              ("AAPL", "NASDAQ:AAPL", "Apple", False),
              ("MSFT", "NASDAQ:MSFT", "Microsoft", False),
              ("NVDA", "NASDAQ:NVDA", "Nvidia", False),
              ("SPY", "AMEX:SPY", "SPDR S&P 500 ETF", False),
              ("GLD", "AMEX:GLD", "SPDR Gold Shares ETF", False),
              ("AMZN", "NASDAQ:AMZN", "Amazon", False),
              ("META", "NASDAQ:META", "Meta Platforms", False),
              ("QQQ", "NASDAQ:QQQ", "Invesco QQQ ETF", False),
          ]

          if STATE_FILE.exists():
              try:
                  state = json.loads(STATE_FILE.read_text())
                  if not isinstance(state, dict):
                      raise ValueError()
              except Exception:
                  raise SystemExit(
                      "Scanner-Gedaechtnis unlesbar. Abbruch."
                  ) from None
          else:
              state = {}
              print(
                  "Neues Scanner-Gedaechtnis: fruehere "
                  "API-Abfragen sind im Zaehler nicht enthalten."
              )

          state.setdefault("used", 0)
          state.setdefault("sent", {})
          state.setdefault("last_request", 0)

          def save_state():
              temporary = STATE_FILE.with_suffix(".tmp")
              temporary.write_text(json.dumps(state))
              temporary.replace(STATE_FILE)

          def active(forex, now):
              berlin = now.astimezone(BERLIN)
              if berlin.weekday() >= 5 or berlin.hour < 6:
                  return False

              if forex:
                  return True

              local = now.astimezone(NY)
              minute = local.hour * 60 + local.minute
              return local.weekday() < 5 and 585 <= minute < 915

          def smooth(values, length, alpha):
              if len(values) < length:
                  raise ValueError("Zu wenige Indikatorwerte")
              result = [None] * (length - 1)
              result.append(sum(values[:length]) / length)
              for value in values[length:]:
                  result.append(
                      result[-1] + alpha * (value - result[-1])
                  )
              return result

          def ema(values, length):
              return smooth(values, length, 2 / (length + 1))

          def rsi(values, length=14):
              changes = [
                  values[i] - values[i - 1]
                  for i in range(1, len(values))
              ]
              gains = smooth(
                  [max(x, 0) for x in changes],
                  length, 1 / length,
              )
              losses = smooth(
                  [max(-x, 0) for x in changes],
                  length, 1 / length,
              )
              result = [None]
              for gain, loss in zip(gains, losses):
                  if gain is None:
                      result.append(None)
                  elif gain == 0 and loss == 0:
                      result.append(50)
                  elif loss == 0:
                      result.append(100)
                  else:
                      result.append(100 - 100 / (1 + gain / loss))
              return result

          def atr_adx(bars, length=14):
              tr, plus, minus = [], [], []
              for previous, current in zip(bars, bars[1:]):
                  high, low = current[2], current[3]
                  tr.append(max(
                      high - low,
                      abs(high - previous[4]),
                      abs(low - previous[4]),
                  ))
                  up = high - previous[2]
                  down = previous[3] - low
                  plus.append(up if up > down and up > 0 else 0)
                  minus.append(
                      down if down > up and down > 0 else 0
                  )

              a = smooth(tr, length, 1 / length)
              p = smooth(plus, length, 1 / length)
              m = smooth(minus, length, 1 / length)
              dx = [
                  100 * abs(x - y) / (x + y) if x + y else 0
                  for x, y in zip(p[length - 1:], m[length - 1:])
              ]
              adx = smooth(dx, length, 1 / length)
              return a[-1], adx[-1]

          def bands(values):
              mean = sum(values) / len(values)
              deviation = math.sqrt(
                  sum((x - mean) ** 2 for x in values) / len(values)
              )
              return mean, mean - 2 * deviation, mean + 2 * deviation

          def reserve_credit():
              # Abstand gilt auch zwischen aufeinanderfolgenden Runs.
              wait = 9 - (time.time() - state["last_request"])
              if wait > 0:
                  time.sleep(wait)

              today = datetime.now(UTC).date().isoformat()
              if state.get("day") != today:
                  state["day"] = today
                  state["used"] = 0

              if state["used"] >= DAILY_LIMIT:
                  return False

              # Auch fehlgeschlagene Anfragen vorsorglich zaehlen.
              state["used"] += 1
              state["last_request"] = time.time()
              save_state()
              return True

          def fetch(symbol, forex):
              params = {
                  "symbol": symbol,
                  "interval": "5min",
                  "outputsize": 500,
                  "timezone": "UTC",
                  "order": "asc",
                  "apikey": key,
              }
              if not forex:
                  params["country"] = "United States"
                  params["prepost"] = "false"

              url = (
                  "https://api.twelvedata.com/time_series?"
                  + urllib.parse.urlencode(params)
              )

              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      data = json.load(response)
              except Exception:
                  raise ValueError("Kursabruf fehlgeschlagen") from None

              if data.get("status") == "error":
                  raise ValueError("Datenanbieter lehnt Anfrage ab")

              meta = data.get("meta", {})
              if meta.get("symbol") != symbol:
                  raise ValueError("Instrument nicht bestaetigt")
              if not forex and meta.get("currency") != "USD":
                  raise ValueError("Kurswaehrung nicht bestaetigt")

              now = datetime.now(UTC)
              rows = []
              for row in data.get("values", []):
                  start = datetime.strptime(
                      row["datetime"], "%Y-%m-%d %H:%M:%S"
                  ).replace(tzinfo=UTC)

                  if start > now:
                      raise ValueError("Kerze liegt in der Zukunft")

                  o, h, l, c = (
                      float(row[field])
                      for field in ("open", "high", "low", "close")
                  )
                  if not all(
                      math.isfinite(x) and x > 0 for x in (o, h, l, c)
                  ):
                      raise ValueError("Ungueltiger Kurs")
                  if not (l <= o <= h and l <= c <= h):
                      raise ValueError("Widerspruechliche Kerze")

                  rows.append((start + INTERVAL, o, h, l, c))

              rows.sort(key=lambda b: b[0])
              if len({b[0] for b in rows}) != len(rows):
                  raise ValueError("Doppelte Kerzen")

              completed = [b for b in rows if b[0] <= now]
              if len(completed) < 100:
                  raise ValueError("Zu wenige abgeschlossene Kerzen")

              # Unfertige Kerzen erzeugen KEINE Signale.
              # Ihr Hoch/Tief darf aber alte Einstiege ungueltig machen.
              return completed, rows

          def models(bars, index, e20, e50, rs):
              history = bars[:index + 1]
              atr, adx = atr_adx(history)
              if not math.isfinite(atr + adx) or atr <= 0:
                  return []

              candle = bars[index]
              previous = bars[index - 1]
              price = candle[4]
              recent = bars[index - 2:index + 1]
              low = min(b[3] for b in recent)
              high = max(b[2] for b in recent)
              results = []

              def add(model, direction, stop, target=None):
                  results.append(
                      (model, direction, stop, target, atr, adx)
                  )

              uptrend = (
                  e20[index] > e50[index]
                  and e50[index] > e50[index - 3]
              )
              downtrend = (
                  e20[index] < e50[index]
                  and e50[index] < e50[index - 3]
              )

              # Modell 1: Ruecksetzer in bestehendem Trend.
              if adx >= 16:
                  if (
                      uptrend
                      and previous[3] <= e20[index - 1] + 0.3 * atr
                      and previous[4] >= e50[index - 1]
                      and price > e20[index]
                      and price > previous[4]
                      and price > candle[1]
                      and 48 <= rs[index] <= 72
                  ):
                      add("Trend-Ruecksetzer", 1, low - 0.2 * atr)

                  if (
                      downtrend
                      and previous[2] >= e20[index - 1] - 0.3 * atr
                      and previous[4] <= e50[index - 1]
                      and price < e20[index]
                      and price < previous[4]
                      and price < candle[1]
                      and 28 <= rs[index] <= 52
                  ):
                      add("Trend-Ruecksetzer", -1, high + 0.2 * atr)

              # Modell 2: Schlusskurs-Ausbruch aus 20 Kerzen.
              window = bars[index - 20:index]
              ceiling = max(b[2] for b in window)
              floor = min(b[3] for b in window)
              body = abs(price - candle[1])

              if adx >= 16 and body >= 0.3 * atr:
                  if (
                      price > ceiling
                      and price - ceiling <= 0.8 * atr
                      and e20[index] > e50[index]
                      and 52 <= rs[index] <= 78
                  ):
                      add(
                          "Ausbruch", 1,
                          min(candle[3], ceiling) - 0.2 * atr,
                      )

                  if (
                      price < floor
                      and floor - price <= 0.8 * atr
                      and e20[index] < e50[index]
                      and 22 <= rs[index] <= 48
                  ):
                      add(
                          "Ausbruch", -1,
                          max(candle[2], floor) + 0.2 * atr,
                      )

              # Modell 3: Rueckkehr aus Bollinger-Band in Seitwaertsphase.
              closes = [b[4] for b in bars]
              mean, lower, upper = bands(closes[index - 19:index + 1])
              _, old_lower, old_upper = bands(closes[index - 20:index])

              if (
                  adx < 22
                  and abs(e20[index] - e20[index - 3]) <= 0.5 * atr
              ):
                  if (
                      previous[4] < old_lower
                      and lower < price < mean
                      and price > previous[4]
                      and rs[index - 1] < 40
                      and rs[index] > rs[index - 1]
                  ):
                      add(
                          "Seitwaerts-Umkehr", 1,
                          low - 0.2 * atr, mean,
                      )

                  if (
                      previous[4] > old_upper
                      and mean < price < upper
                      and price < previous[4]
                      and rs[index - 1] > 60
                      and rs[index] < rs[index - 1]
                  ):
                      add(
                          "Seitwaerts-Umkehr", -1,
                          high + 0.2 * atr, mean,
                      )

              return results

          def send(text):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=json.dumps({
                      "chat_id": chat,
                      "text": text,
                      "link_preview_options": {"is_disabled": True},
                  }).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      raise ValueError()
              except Exception:
                  raise ValueError("Telegram-Versand fehlgeschlagen") from None

          def scan(symbol, tv_symbol, name, forex):
              bars, all_bars = fetch(symbol, forex)
              now = datetime.now(UTC)
              age = (now - bars[-1][0]).total_seconds()
              if not 0 <= age <= 360:
                  print(tv_symbol + ": Daten zu alt, kein Signal.")
                  return 0

              previous_send = state["sent"].get(tv_symbol, {})
              if (
                  time.time() - previous_send.get("sent_at", 0)
                  < COOLDOWN_MINUTES * 60
              ):
                  print(tv_symbol + ": 30-Minuten-Signalpause.")
                  return 0

              close = [b[4] for b in bars]
              e20, e50 = ema(close, 20), ema(close, 50)
              rs = rsi(close)
              reasons = Counter()
              digits = 5 if forex else 2

              # Neueste Muster zuerst; maximal ein Signal pro Instrument.
              for index in range(len(bars) - 1, 59, -1):
                  candle = bars[index]
                  stamp = candle[0]
                  if now - stamp > timedelta(minutes=LOOKBACK_MINUTES):
                      break
                  if stamp.timestamp() <= previous_send.get("bar", 0):
                      continue
                  if not active(forex, stamp):
                      continue
                  if any(
                      bars[j][0] - bars[j - 1][0] != INTERVAL
                      for j in (index - 1, index)
                  ):
                      reasons["Kerzenluecke"] += 1
                      continue

                  candidates = models(bars, index, e20, e50, rs)
                  if not candidates:
                      reasons["kein Modell erfuellt"] += 1
                      continue

                  for model, direction, raw_stop, raw_target, atr, adx in candidates:
                      entry = round(candle[4], digits)
                      stop = round(raw_stop, digits)
                      risk = direction * (entry - stop)

                      if not 0.8 * atr <= risk <= 3 * atr or stop <= 0:
                          reasons["Stop-Abstand ungeeignet"] += 1
                          continue

                      target = round(
                          raw_target if raw_target is not None
                          else entry + direction * 2 * risk,
                          digits,
                      )
                      reward = direction * (target - entry)
                      if target <= 0 or reward / risk < 1.3:
                          reasons["zu wenig Platz zum Ziel"] += 1
                          continue

                      later = [b for b in all_bars if b[0] > stamp]
                      if any(
                          (b[3] <= stop or b[2] >= target)
                          if direction == 1 else
                          (b[2] >= stop or b[3] <= target)
                          for b in later
                      ):
                          reasons["Stop oder Ziel bereits beruehrt"] += 1
                          continue

                      # Letzter gelieferter Kurs, kein garantierter Live-Quote.
                      latest = all_bars[-1][4]
                      lower = round(entry - 0.25 * risk, digits)
                      upper = round(entry + 0.25 * risk, digits)
                      if not lower <= latest <= upper:
                          reasons["Kurs zu weit vom Einstieg"] += 1
                          continue

                      current = datetime.now(UTC)
                      if not active(forex, current):
                          return 0

                      # Kurze Frist fuer neue, noch nicht gefuellte Order.
                      local = current.astimezone(BERLIN if forex else NY)
                      session_end = local.replace(
                          hour=23 if forex else 15,
                          minute=59 if forex else 15,
                          second=0,
                          microsecond=0,
                      ).astimezone(UTC)
                      expiry = min(
                          current + timedelta(minutes=10), session_end
                      )
                      if (expiry - current).total_seconds() < 60:
                          return 0

                      side = "🟢 BUY" if direction == 1 else "🔴 SELL / SHORT"
                      quote_side = "Kaufkurs" if direction == 1 else "Verkaufskurs"
                      identifier = (
                          f"{tv_symbol}-{stamp:%Y%m%d-%H%M}-"
                          f"{'BUY' if direction == 1 else 'SELL'}"
                      )
                      chart = (
                          "https://www.tradingview.com/chart/?symbol="
                          + urllib.parse.quote(tv_symbol, safe="")
                          + "&interval=5"
                      )
                      source = (
                          "Twelve Data Sammelkurs, nicht OANDA."
                          if forex else "Twelve Data."
                      )

                      text = (
                          "🚦 EINSTIEG · NUR PAPER TRADING 🚦\n"
                          f"{side} {name}\n"
                          f"Symbol: {tv_symbol}\n"
                          f"Analyse: {model}\n\n"
                          f"🎯 Einstieg LIMIT: {entry:.{digits}f}\n"
                          f"🛑 Stop-Loss: {stop:.{digits}f}\n"
                          f"✅ Take-Profit: {target:.{digits}f}\n"
                          f"Ziel/Stop-Abstand: {reward / risk:.2f}:1\n"
                          "Preise in USD; bei Forex USD je EUR/GBP.\n\n"
                          f"Nur handeln, wenn der TradingView-{quote_side}\n"
                          f"zwischen {lower:.{digits}f} und "
                          f"{upper:.{digits}f} liegt.\n"
                          "Sonst Signal auslassen.\n\n"
                          f"⏳ Ungefuellte Einstiegsorder um "
                          f"{expiry.astimezone(BERLIN):%H:%M} Uhr Berlin "
                          "manuell loeschen.\n"
                          "Gefuellte Position bleibt bis SL/TP "
                          "oder manuellem Schliessen offen.\n\n"
                          f"Hier in TradingView oeffnen:\n{chart}\n"
                          "Broker: Paper Trading · Chart: 5 Minuten\n"
                          f"Muster: {stamp.astimezone(BERLIN):%H:%M} "
                          "Uhr Berlin\n"
                          f"Kursquelle: {source}\n"
                          f"ID: {identifier}\n"
                          "Gleiche ID nur einmal handeln. "
                          "Bestehende Position vorher selbst pruefen."
                      )

                      # Vor Versand reservieren: keine automatische
                      # Wiederholung bei unklarem Telegram-Timeout.
                      state["sent"][tv_symbol] = {
                          "bar": stamp.timestamp(),
                          "sent_at": time.time(),
                      }
                      save_state()
                      send(text)
                      print(tv_symbol + ": " + model + " gesendet.")
                      return 1

              explanation = "; ".join(
                  f"{reason}: {count}"
                  for reason, count in reasons.items()
              )
              print(tv_symbol + ": kein Einstieg. " + explanation)
              return 0

                    sent = 0
          errors = 0

          # Devisen bei jedem Durchlauf, US-Instrumente im Wechsel.
          now = datetime.now(UTC)
          selected = [
              item for item in instruments
              if item[3] and active(True, now)
          ]
          us_instruments = [
              item for item in instruments if not item[3]
          ]

          if active(False, now):
              cursor = int(state.get("us_cursor", 0)) % len(us_instruments)
              batch_size = min(5, len(us_instruments))

              selected.extend(
                  us_instruments[(cursor + offset) % len(us_instruments)]
                  for offset in range(batch_size)
              )

              state["us_cursor"] = (
                  cursor + batch_size
              ) % len(us_instruments)

          save_state()

          print(
              "Instrumente in diesem Durchlauf: "
              + (
                  ", ".join(item[1] for item in selected)
                  if selected else "keine; ausserhalb des Zeitfensters"
              )
          )

          try:
              for symbol, tv_symbol, name, forex in selected:
                  if not active(forex, datetime.now(UTC)):
                      print(tv_symbol + ": ausserhalb des Zeitfensters.")
                      continue

                  if not reserve_credit():
                      print("Tageszaehler erreicht: keine weiteren Abrufe.")
                      break

                  try:
                      sent += scan(symbol, tv_symbol, name, forex)
                  except Exception:
                      errors += 1
                      print(
                          tv_symbol
                          + ": Datenpruefung oder Versand fehlgeschlagen."
                      )
          finally:
              save_state()

          summary = (
              f"Abgeschlossen: {sent} Signale, {errors} Fehler.\n"
              f"Beobachtungsliste: {len(instruments)} Instrumente.\n"
              f"Fuer diesen Durchlauf ausgewaehlt: {len(selected)}.\n"
              f"Gespeicherter Tageszaehler: "
              f"{state['used']}/{DAILY_LIMIT} Abrufe.\n"
              "US-Instrumente werden im Wechsel geprueft.\n"
              "Keine Signale werden zur Erfuellung einer Quote erzeugt."
          )
          print(summary)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")

          if errors:
              raise SystemExit("Mindestens eine Pruefung fehlgeschlagen.")
          PY

      - name: Scanner-Gedaechtnis speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner-state.json
          key: scanner-v3-${{ github.run_id }}-${{ github.run_attempt }}
